<!DOCTYPE html>
<html lang="ko">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALT S11 시즌 리포트 (공개용)</title>
<style>
:root{
  --bg:#F2F4F8; --panel:#FFFFFF; --panel2:#F1F4F9; --line:#E3E7EF; --ink:#1B2333; --mute:#687287; --dim:#9AA3B3;
  --me:#3B6FE5; --avg:#E5484D; --win:#1F9D63; --lose:#E5484D; --gold:#D98A1F;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; --serif:var(--sans);
  --shadow:0 1px 2px rgba(27,35,51,.05),0 2px 8px rgba(27,35,51,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding-bottom:40px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
header.top{padding:22px 0 12px}
.kicker{font-size:12px;letter-spacing:.08em;color:var(--me);font-weight:700}
h1{font-size:24px;margin:4px 0 6px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:13px;line-height:1.5}
nav.chips{position:sticky;top:0;z-index:5;background:rgba(242,244,248,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav.chips .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
nav.chips button{flex:0 0 auto;font-size:13px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
nav.chips button.on{color:var(--ink);border-color:var(--me)}
section{padding-top:22px}
h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.h2sub{color:var(--mute);font-size:12.5px;margin-bottom:10px;line-height:1.45}
.ico{width:28px;height:28px;border-radius:6px;display:inline-block;vertical-align:middle;background:#E9EDF4;object-fit:cover;flex:0 0 auto}
.ico.s{width:22px;height:22px;border-radius:5px}
.ico.l{width:36px;height:36px;border-radius:8px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--mute);border:1px solid var(--line);white-space:nowrap}
.w{color:var(--win)} .l{color:var(--lose)} .g{color:var(--gold)} .m{color:var(--mute)} .d{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}
.chev{color:var(--dim);margin-left:auto;padding-left:6px}

/* teams */
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.team b{font-size:15px}
.team .rec{font-size:20px;font-weight:800;margin:2px 0 6px}
.sq{display:flex;gap:3px;flex-wrap:wrap}
.sq i{width:12px;height:12px;border-radius:3px;display:block}
.sq i.W{background:var(--win)} .sq i.L{background:#FDECEC;border:1px solid var(--lose)}
@media (max-width:560px){.teams{grid-template-columns:repeat(2,1fr)}}

/* lineup */
.lineup{display:flex;flex-direction:column;gap:8px}
.lu{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.lu:hover,.row:hover,.set:hover,.best:hover{border-color:#BCC7DB}
.lu .pos{width:34px;font-size:12px;color:var(--mute);font-weight:700}
.lu .who{min-width:0;flex:1}
.lu .who b{font-size:15px}
.lu .line2{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.45}
.score{font-size:22px;font-weight:800;color:var(--me);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.score.sm{font-size:16px;min-width:34px}

/* best */
.bests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.best{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;width:100%}
.best .top{display:flex;align-items:center;gap:8px}
.best .kda{font-size:17px;font-weight:800}
.best .meta{font-size:12px;color:var(--mute);line-height:1.45}
@media (max-width:640px){.bests{grid-template-columns:repeat(2,1fr)}}

/* rank table */
.ptabs,.sorts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ptabs button,.sorts button{font-size:13px;padding:5px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.ptabs button.on{color:var(--bg);background:var(--me);border-color:var(--me);font-weight:700}
.sorts button.on{color:var(--ink);border-color:var(--me)}
.sorts span{font-size:12px;color:var(--dim);align-self:center;margin-right:2px}
table.rank{width:100%;border-collapse:collapse;font-size:13px}
table.rank th{font-weight:600;color:var(--mute);font-size:12px;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rank th:nth-child(-n+2){text-align:left}
table.rank th.on{color:var(--me)}
table.rank td{padding:8px 6px;border-bottom:1px solid #E9EDF4;text-align:right;white-space:nowrap}
table.rank td:nth-child(-n+2){text-align:left}
table.rank tr{cursor:pointer}
table.rank tr:hover td{background:#F4F7FB}
table.rank tr.one td{opacity:.5}
.nm{font-weight:700;color:var(--ink)}
td.msum{display:none}
@media (max-width:560px){
  table.rank thead{display:none}
  table.rank td{display:none}
  table.rank td.msum{display:table-cell;text-align:left;white-space:normal}
  .ms1{display:flex;align-items:center;gap:8px}
  .ms1 .chev{margin-left:0}
  .ms2{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ms2 b{color:var(--me);font-weight:700}
}

/* games */
.day{margin-bottom:12px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:0 0 6px}
.dayhead b{font-size:15px}
.set{display:grid;grid-template-columns:52px auto minmax(0,1fr);align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;width:100%}
.set .sn{font-size:12px;color:var(--mute);line-height:1.35}
.set .picks{display:flex;flex-direction:column;gap:3px;min-width:0}
.set .pr{display:flex;align-items:center;gap:3px}
.set .pr span{font-size:10.5px;color:var(--dim);width:30px;flex:0 0 auto}
.set .pr.win span{color:var(--win)}
.set .res{font-size:12px;text-align:right;line-height:1.35;overflow-wrap:anywhere}

/* champs */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.cg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;line-height:1.35}
.cg img{width:36px;height:36px;border-radius:8px;display:block;margin:0 auto 4px}

.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:#3A4458;line-height:1.65}
.note b{color:var(--ink)}
.note ul{margin:4px 0;padding-left:18px}

/* modal */
 /* 임베드(S11 프리뷰 카드 안): 선수 카드만 */
body.embed header.top, body.embed nav.rounds, body.embed main, body.embed footer, body.embed .sh-head{display:none!important}
body.embed.deep .sh-head{display:flex!important;position:static} body.embed #close, body.embed #shtop{display:none!important}
body.embed{background:#fff;padding:0!important}
body.embed .ov{position:static!important;display:block!important;background:none!important;padding:0!important;width:auto!important;border:0!important;box-shadow:none!important}
body.embed .sheet{max-width:none!important;max-height:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;height:auto!important}
body.embed.blank #sh{pointer-events:none}
body.embed.blank #sh .ico, body.embed.blank #sh img{visibility:hidden}
.ov{position:fixed;inset:0;background:rgba(27,35,51,.38);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}
.ov.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.sh-head{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);z-index:2}
.sh-head button{font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.sh-head .sp{flex:1}
#bisf{display:block;width:100%;height:calc(100dvh - 150px);min-height:520px;border:0;border-radius:14px;background:transparent}
.sh-head .shtop{background:var(--me);border-color:var(--me);color:#fff;font-weight:700}
.sh-body{padding:14px}
@media (max-width:560px){
  .ov{padding:0;align-items:flex-end}
  .sheet{max-width:none;border-radius:16px 16px 0 0;max-height:90vh}
}
.pc-top{display:flex;gap:12px;align-items:center}
.pc-top .nmbig{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pc-top .meta{font-size:13px;color:var(--mute);margin-top:2px}
.pc-score{margin-left:auto;text-align:right}
.pc-score .v{font-size:30px;font-weight:800;color:var(--me);line-height:1}
.pc-score .r{font-size:12px;color:var(--mute);margin-top:3px}
.pc-champs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 2px}
.pc-champs .c{position:relative}
.pc-champs .c em{position:absolute;right:-3px;bottom:-3px;font-style:normal;font-size:10px;font-weight:800;border-radius:4px;padding:0 3px;background:var(--bg)}
.radar{width:100%;max-width:470px;display:block;margin:6px auto 0}
.vsw{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:10px 0 0;padding:8px 12px;background:#F4F6FA;border-radius:12px;font-size:12.5px;color:var(--mute)}
.vsw .wkh{font-weight:800;color:var(--ink,#1B2333);margin-right:2px}
.vsw .wki b{color:var(--ink,#1B2333)} .vsw .wki .d{margin-left:4px;font-size:11.5px}
.vsw .up{color:#1F9D55;margin-left:2px;font-size:11px} .vsw .dn{color:#E5484D;margin-left:2px;font-size:11px} .vsw .eq{color:#9AA3B3;margin-left:2px;font-size:11px}
.scopet{margin:10px 0 0} .rdt{margin:12px 0 0;justify-content:center} .scopet button[disabled]{opacity:.4}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mute);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.subh{font-size:13px;font-weight:700;margin:16px 0 6px;color:var(--mute)}
.tick{background:var(--panel);border:1px solid #E8EBF1;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tkbar{display:flex;align-items:center;gap:6px;padding:0 6px 0 0;min-height:48px}
.tkvp{flex:1;overflow:hidden;min-width:0;touch-action:pan-y}
.tktr{display:flex;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.tktr.nt{transition:none}
.tki{flex:0 0 100%;display:flex;align-items:center;gap:10px;padding:12px 4px 12px 14px;text-align:left;min-width:0}
.tki .tkt{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tki .tkt .m{display:none}
.tki .tkt .nc,.tki .tkt .tag{padding-top:1px;padding-bottom:1px}
.tkn{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.tktog{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mute);flex:0 0 auto}
.tktog svg{transition:transform .2s}
.tick.open .tktog svg{transform:rotate(180deg)}
.tklist{display:none;border-top:1px solid #E9EDF4;padding:0 14px}
.tick.open .tklist{display:block}
.tkh{display:none;flex:1;padding:0 14px;font-size:14px;font-weight:800}
.tick.open .tkvp,.tick.open .tkn{display:none}
.tick.open .tkh{display:block}
.hl{display:flex;flex-direction:column;background:var(--panel);border:1px solid #E8EBF1;border-radius:14px;padding:4px 14px;box-shadow:var(--shadow)}
.hlr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid #E9EDF4;text-align:left;width:100%}
.hlr:last-child{border-bottom:0}
.hlk{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;white-space:nowrap}
.hlk.up{background:#FDE8E8;color:#C62E2E}.hlk.brk{background:#EEE9FB;color:#6A45C9}.hlk.top{background:#FFF3D6;color:#A86A00}
.hlk.hi{background:#E4EDFD;color:#2F5FD0}.hlk.run{background:#E3F6EC;color:#18804B}.hlk.big{background:#FFE9DC;color:#B4531A}.hlk.cup{background:#1B2333;color:#FFD66B}
.hlt{font-size:14px;line-height:1.45;min-width:0}.hlt .m{display:block;font-size:11.5px}
.h2more summary{list-style:none;cursor:pointer;font-size:13px;color:var(--me);font-weight:700;padding:10px 0 2px}
.h2more summary::-webkit-details-marker{display:none}
.h2more[open] summary{display:none}
.h2r{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #E9EDF4;width:100%;text-align:left}
.h2r .num{font-size:13px}
.h2g{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #E9EDF4;width:100%;text-align:left}
.h2g .vsx{font-size:11px;color:var(--mute)}
.h2hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px;font-weight:800}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.diffs div{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.diffs b{display:block;font-size:17px}
.diffs span{font-size:11px;color:var(--mute)}
.gl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #E9EDF4;width:100%}
.gl .mid{font-size:12.5px;line-height:1.45;min-width:0}
.gl .mid .m{font-size:11.5px}
.sb{width:100%;border-collapse:collapse;font-size:12.5px}
.sb td{padding:6px 4px;border-bottom:1px solid #E9EDF4;white-space:nowrap}
.sb td.r{text-align:right}
.sb tr.hd td{color:var(--mute);font-size:11.5px;padding-top:12px}
.sb tr.pl{cursor:pointer}
.sb tr.pl:hover td{background:#F1F4F9}
.foot{color:var(--dim);font-size:12px;margin-top:22px;line-height:1.6}

/* ---------- 빛난 세 명 ---------- */
.stars{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px}
.stc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;display:flex;flex-direction:column;gap:6px;min-width:0}
.stc:hover{border-color:#BCC7DB}
.st-h{display:flex;align-items:center;gap:8px;min-width:0}
.st-rk{font-size:22px;font-weight:800;color:var(--gold);min-width:16px}
.st-nm{min-width:0;flex:1} .st-nm .m{font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stc .radar{width:100%;max-width:440px;margin:0 auto}
.st-pts{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
.st-pts b{color:var(--ink);font-weight:800;font-size:14px;margin-right:4px}
.trk{display:flex;flex-direction:column;align-items:center;line-height:1}
.mv{font-size:10.5px;font-weight:700;color:var(--dim);margin-top:3px} .mv.up{color:var(--win)} .mv.dn{color:var(--lose)}
.cum{font-size:11.5px;color:var(--mute);margin-top:2px} .cum b{color:var(--ink);font-weight:700}
.trow{grid-template-columns:30px 56px 1fr auto}
@media (max-width:640px){
  .stars{grid-template-columns:1fr}
  .st-nm .m{white-space:normal}
}

.team,.lu,.best,.trow,.stc,.set2,.mcard,.cg,.note,.set,.sheet{box-shadow:var(--shadow);border-color:#E8EBF1}
.nc,.tbadge{box-shadow:inset 0 0 0 1px rgba(27,35,51,.10)}
#rsel{color:#fff} nav.rounds button.on{color:#fff}

.bdg.c-fight,.b1.c-fight{background:#FDECEC;border-color:#F5C2C4;color:#B4262C}
.bdg.c-champ,.b1.c-champ{background:#F1EBFD;border-color:#D8C9F7;color:#6A3FC9}
.bdg.c-pos,.b1.c-pos{background:#E8F6EF;border-color:#BFE6D1;color:#1B7A4D}
.bdg.c-sup,.b1.c-sup{background:#E6F5F8;border-color:#BCE3EB;color:#16788C}
.bdg.c-ban,.b1.c-ban{background:#EAF0FD;border-color:#C6D5F7;color:#2C58C2}
.bdg.c-pog,.b1.c-pog{background:#FFF4E2;border-color:#F4D6A6;color:#A8640D}
.bdg.c-etc,.b1.c-etc{background:#F1F4F9;border-color:#E3E7EF;color:#4A5468}
.bdg.h,.b1.h{background:#FFF1D6;border-color:#E9B25A;color:#9A5B05;font-weight:700}
.bdg.on{box-shadow:0 0 0 2px currentColor}

.bdg.c-bronze,.b1.c-bronze{background:#F5E6DA;border-color:#C9936A;color:#7E4B26;font-weight:700}
.bdg.c-goldt,.b1.c-goldt{background:#FCF3D6;border-color:#E0B748;color:#8C6608;font-weight:700}
.bdg.c-dia,.b1.c-dia{background:#E8EEFF;border-color:#8FA9F2;color:#3550B8;font-weight:700}
.bdg.c-chall,.b1.c-chall{background:linear-gradient(120deg,#E3F1FF 0%,#FFF4D9 100%);border-color:#D4AE4E;color:#1D5AA6;font-weight:800}
.h2sub,.pgsub{display:none!important}
.score.est{color:#7F9BE0}
.bdg.c-tb-sweep{background:#E3F6EC;border-color:#8FD3AE;color:#146C3F;font-weight:700}
.bdg.c-tb-up{background:#FFEAD9;border-color:#F2B98C;color:#B4530B;font-weight:700}
.bdg.c-tb-down{background:#DDF0FB;border-color:#92CBEB;color:#0F6A9C;font-weight:700}
.bdg.c-tb-tank{background:#F37321;border-color:#F37321;color:#fff;font-weight:800}
.bdg.c-tb-weight{background:#111;border-color:#AA8A3C;color:#D4AF5A;font-weight:800}
.bdg.c-tb-circus{background:#E2012D;border-color:#E2012D;color:#fff;font-weight:800}
.bdg.c-tb-goblin{background:#0B0B0B;border-color:#1FD2C6;color:#fff;font-weight:800}
.bdg.c-tb-bully{background:#EEF0FF;border-color:#A9B2F2;color:#3D46B0;font-weight:700}
.bdg.c-time,.b1.c-time{background:#EEF2F7;border-color:#C9D3E1;color:#3E4C63}
.bdg.c-ig,.b1.c-ig{background:#E8F7F4;border-color:#A9DFD3;color:#0E7A66}
.bdg.c-loan,.b1.c-loan{background:#FFF4E5;border-color:#F3D3A6;color:#A35A00}
.smtabs{margin:0 4px 6px}
.sqtabs{margin:0 0 6px}
.smapc{padding:10px 8px 8px;background:var(--panel);border:1px solid #E8EBF1;border-radius:14px;box-shadow:var(--shadow)}.smap{width:100%;height:auto;display:block}.smleg{font-size:11.5px;color:var(--mute);padding:4px 6px 0}
.shist{font-size:12px;color:var(--mute);margin:2px 0 4px}.shist b{color:var(--ink)}
.loan{display:inline-block;font-size:10px;font-weight:800;color:#A35A00;background:#FFF4E5;border:1px solid #F3D3A6;border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:1px}
.nc .lv{font-style:normal;font-size:.78em;font-weight:600;opacity:.72;margin-left:3px;font-variant-numeric:tabular-nums}
.lvb{font-size:.6em;font-weight:600;color:var(--mute);margin-left:6px;vertical-align:3px}
.ncw{display:inline-flex;align-items:center;gap:4px;max-width:100%;min-width:0;vertical-align:middle}
.ncw .nc{min-width:0}
.lvt{flex:0 0 auto;font-size:10.5px;font-weight:700;line-height:1;padding:3px 4px;border-radius:4px;background:#1B2333;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.recg{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

    p.kp=A('kp'); p.share=A('share'); p.gd=A('gd'); p.dd=A('dd'); p.csd=A('csd'); p.wpm=A('wpm'); p.tkpm=A('tkpm'); p.ksh=A('ksh'); p.gsh=A('gsh'); p.lv=A('lv'); p.lvd=A('lvd'); p.score=A('score'); p.nsc=N('score');
    p.cspm = SUM('csM') ? SUM('csN')/SUM('csM') : null; p.gpm = SUM('gM') ? SUM('gN')/SUM('gM') : null; p.dpm = SUM('dM') ? SUM('dN')/SUM('dM') : null;
    p.apm = SUM('aM') ? SUM('aN')/SUM('aM') : null; p.act = SUM('aM') ? SUM('actN')/SUM('aM')*10 : null; p.dpg = SUM('dgG') ? SUM('dgD')/SUM('dgG') : null;

function radarQ(p){ return axesFor(p.pos).map(a=>{ const q=pctl(p.pos,a.k,p[a.k],a.inv); return q==null?null:q; }); }
function miniRadar(p){
  const AX = axesFor(p.pos), W=300, H=250, cx=150, cy=125, R=72, q=radarQ(p);

  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.name)} 지표">`;
  [1,.5].forEach(f=>{ s+=`<polygon points="${AX.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="${f===1?'#F7F9FC':'none'}" stroke="#E3E7EF"/>`; });
  AX.forEach((_,i)=>{ const [x,y]=pt(i,R); s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E9EDF4"/>`; });
  s+=`<polygon points="${AX.map((_,i)=>pt(i,R*.55).join(',')).join(' ')}" fill="none" stroke="var(--avg)" stroke-dasharray="4 3"/>`;
  s+=`<polygon points="${q.map((v,i)=>pt(i,R*(.1+.9*(v??0))).join(',')).join(' ')}" fill="rgba(59,111,229,.16)" stroke="var(--me)" stroke-width="2.5"/>`;
  AX.forEach((a,i)=>{ const [x,y]=pt(i,R+14); const anchor = Math.abs(x-cx)<10?'middle':(x>cx?'start':'end'); const dy = y<cy-20 ? -2 : (y>cy+20 ? 14 : 6);
    const hit = top.has(a.k), none = q[i]==null;
    s+=`<text x="${x}" y="${y+dy}" text-anchor="${anchor}" font-size="16" font-weight="${hit?800:600}" fill="${hit?'var(--me)':(none?'#B4BCC9':'#687287')}">${a.s}</text>`; });
  return s+'</svg>';
}
function strengths(p, n){
  return axesFor(p.pos).map(a=>({a, q:pctl(p.pos,a.k,p[a.k],a.inv), rk:p[a.k]!=null?rankOf(p,a.k,a.inv):null})).filter(x=>x.q!=null)
    .sort((x,y)=>y.q-x.q || (x.rk||99)-(y.rk||99)).slice(0,n);
}
function wkIdx(p){ const q=radarQ(p).filter(v=>v!=null); if(q.length<4) return null; return .8*q.reduce((a,b)=>a+b,0)/q.length + .1*p.wr + .1*(p.pog>0?1:0); }
function stars(){

  return `<div style="font-size:19px;font-weight:800">${L} vs ${R} · ${RL(s.r)}${s.n?' '+s.n+'세트':''}</div>

  if(Math.abs(dx)>=70 && j>=0 && j<TABS.length){ goTab(TABS[j][0], dx<0?1:-1); }

// 공유: 1) 이미지를 만들어 미리보기로 띄우고 2) 거기서 공유/저장. 공유 시트는 버튼을 누른 그 순간에 열어야

async function snap(card){

function showSharePrev(blob, fname, url){
  const file = new File([blob], fname, {type:'image/png'});
  let canShare = false; try{ canShare = !!(navigator.canShare && navigator.canShare({files:[file]})); }catch(e){}
  const canCopy = !!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem);
  const old = document.querySelector('.shprev'); if(old) old.remove();
  const w = document.createElement('div'); w.className = 'shprev'; w.setAttribute('role','dialog'); w.setAttribute('aria-label','공유 이미지');
  w.innerHTML = `<div class="spbox"><img src="${url}" alt="공유 이미지"><div class="spbtn"><button class="sp1" data-sp="save">이미지 저장</button><button class="sp2" data-sp="close">닫기</button></div><div class="spmsg" aria-live="polite"></div></div>`;
  document.body.appendChild(w);
  const msg = w.querySelector('.spmsg');
  w.addEventListener('click', async (e)=>{
    if(e.target === w){ w.remove(); return; }
    const b = e.target.closest('[data-sp]'); if(!b) return; const a = b.dataset.sp;
    if(a==='close'){ w.remove(); return; }
    if(a==='share'){ try{ await navigator.share({files:[file]}); msg.textContent = '공유했습니다.'; }
      catch(err){ if(!(err && err.name==='AbortError')) msg.textContent = DL ? '공유가 막혔어요. 이미지 저장을 눌러 주세요.' : '공유가 막혔어요. 이미지를 길게 눌러 저장해 주세요.'; } return; }
    if(a==='copy'){ try{ await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]); msg.textContent = '복사했습니다. 카톡 대화창에 붙여넣어 주세요.'; }
      catch(err){ msg.textContent = DL ? '복사가 막혔어요. 이미지 저장을 눌러 주세요.' : '복사가 막혔어요.'; } return; }
    if(a==='save'){   // 저장 기능(downloads)이 늦게 붙거나 없는 화면도 있어서: 다시 확인 → 공유창 → 파일 받기 순서로
      if(!DL && window.claude && claude.use){ try{ DL = await Promise.race([claude.use('downloads'), new Promise(r=>setTimeout(()=>r(null),2500))]); }catch(err){} }
      if(DL){ try{ await DL.save({filename:fname, data: blob}); msg.textContent = '저장했습니다.'; }
        catch(err){ msg.textContent = (err && err.code==='declined') ? '' : '저장하지 못했습니다. 다시 눌러 주세요.'; } return; }
      if(canShare){ try{ await navigator.share({files:[file]}); return; } catch(err){ if(err && err.name==='AbortError') return; } }
      try{ const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = fname; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000); msg.textContent = '저장 창이 안 뜨면 리포트를 새로고침한 뒤 다시 눌러 주세요.'; }
      catch(err){ msg.textContent = '이 화면에선 저장이 막혀 있어요. 리포트를 새로고침해 주세요.'; } }
  });
}

}
function loadAssets(){
  if(Object.keys(ICONS).length) return;
  Promise.all([fetch('assets/champs.json').then(r=>r.json()), fetch('assets/items.json').then(r=>r.json())])
    .then(([c,i])=>{ Object.assign(ICONS,c); Object.assign(ITMIMG,i); drawAll(); if(stack.length) render(); }).catch(()=>{});
}
function drawAll(){
  drawTabs();
  PL = addComposites(agg(fRows()));
  drawNav(); drawHeader(); drawHeadlines(); drawTeams(); drawLineup(); drawBadges(); drawRank(); drawGames(); drawChamps(); drawStars(); drawRecords();
}
// 공개용: 시즌 중엔 최신 라운드부터(주간 리포트처럼), 결승까지 끝났으면 시즌 전체부터 (형 11-13)
if(SHARE && !ROUNDS.includes(14) && ROUNDS.length) F = ROUNDS[ROUNDS.length-1];
// 공개 사이트 시즌 버튼: S10 | S11. 최신 시즌(S11)은 그 안에서 'n주차 리포트 | 프리뷰'로 나눔 (형 11-20)
//   주소: https://altreport.github.io/ = S11 최신 주차 · https://altreport.github.io/preview/ = S11 프리뷰 · https://altreport.github.io/s10/ = S10
if(SHARE){
  const cur = +D.season, wk = ROUNDS.length ? Math.max(...ROUNDS.filter(r=>r<=12)) : 0;
  $('#seasonNav').innerHTML = `<a class="${cur===10?'on':''}" href="https://altreport.github.io/s10/">S10</a><a class="${cur===11?'on':''}" href="https://altreport.github.io/">S11</a>`;
  $('#seasonNav').style.display = '';
  // (형 11-20) 위에 탭을 또 두지 않음: S11 프리뷰는 라운드 고르기 목록 맨 아래
}
drawAll(); loadAssets();
// 임베드: S11 프리뷰 선수 카드에서 iframe으로 부름 (#card=이름[&blank=1&as=표시이름]) (형 11-15)
(()=>{ try{ const h = new URLSearchParams(location.hash.slice(1)); const nm = h.get('card'); if(!nm) return;
  document.body.classList.add('embed'); document.documentElement.style.background = '#fff'; if(h.get('blank')) document.body.classList.add('blank');
  F = 'all'; drawAll(); const low = nm.toLowerCase();
  let ps = PL.filter(x=>x.name.toLowerCase()===low).sort((a,b)=>b.n-a.n);
  if(!ps.length && h.get('blank')) ps = PL.filter(x=>x.ing && x.nsc>=3).sort((a,b)=>b.n-a.n);   // S10 기록 없는 선수: 빈 틀만 쓰려고 아무 카드
  if(!ps.length){ document.body.innerHTML = '<div style="padding:24px;text-align:center;color:#687287;font-size:14px">S10 리그 기록 없음</div>'; return; }
  open({t:'p', id: ps[0].id}); document.body.classList.remove('dock'); setTimeout(()=>{ window.__embedReady = true; }, 0);
  if(h.get('blank')){ window.BLANK_NEW = !PL.some(x=>x.name.toLowerCase()===low); window.BLANK_AS = h.get('as') || nm; blankCard($('#sh'), BLANK_AS); }
}catch(e){} })();
function blankCard(root, asName){
  root.querySelectorAll('.vsw,.scopet,.bdgs,.bwhy,details.fold,.pcact,.rep,.h2b,.h2r,.h2more,.redtog,.empty,[data-more]').forEach(x=>x.remove());
  root.querySelectorAll('.ptabs:not(.rdt)').forEach(x=>x.remove());
  const nb = root.querySelector('.nmbig'); if(nb) nb.textContent = asName;
  const mt = root.querySelector('.meta'); if(mt) mt.textContent = 'S11';
  root.querySelectorAll('.shist,.lvt').forEach(x=>x.remove());
  const pc = root.querySelector('.pc-champs'); if(pc){ pc.innerHTML = '<span class="c"><span class="ico l" style="visibility:visible;background:#EEF1F6"></span></span>'.repeat(3); const sh = pc.previousElementSibling; if(sh && sh.classList.contains('subh')) sh.textContent = '챔피언'; }
  root.querySelectorAll('.legend span').forEach((x,i)=>{ if(i===0){ const dot = x.querySelector('i'); x.textContent = ' ' + asName; if(dot) x.prepend(dot); } });
  if(window.BLANK_NEW){ const r = root.querySelector('.pc-score .r'); if(r) r.textContent = '평점'; }
  // 레이더: 선수 선을 가운데로
  root.querySelectorAll('svg polygon').forEach(pg=>{ if((pg.getAttribute('stroke')||'').includes('--me')){ const box = pg.ownerSVGElement.viewBox.baseVal; const cx = box.x+box.width/2, cy = box.y+box.height/2; pg.setAttribute('points', `${cx},${cy} ${cx},${cy} ${cx},${cy}`); } });
  root.querySelectorAll('svg polygon').forEach(pg=>{ if((pg.getAttribute('stroke')||'').includes('--avg')) pg.remove(); });
  root.querySelectorAll('.legend span').forEach(x=>{ if(x.innerHTML.includes('--avg')) x.remove(); });
  root.querySelectorAll('svg circle').forEach(c=>{ if((c.getAttribute('fill')||'').includes('--me')) c.remove(); });
  // 숫자 → –
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const ns = []; let n; while(n = tw.nextNode()) ns.push(n);
  ns.forEach(t=>{ if(t.parentElement && t.parentElement.closest('.nmbig,.meta')) return; t.textContent = t.textContent.replace(/[+\-−]?\d+(?:[.,]\d+)?(?:%|k|판|승|패|위|점)?/g, '–'); });
}
