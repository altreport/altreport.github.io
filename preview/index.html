<!DOCTYPE html>
<html lang="ko">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALT 리그 S11 시즌 프리뷰</title>
<style>
:root{
  --bg:#F2F4F8; --panel:#FFFFFF; --panel2:#F1F4F9; --line:#E3E7EF; --ink:#1B2333; --mute:#687287; --dim:#9AA3B3;
  --me:#3B6FE5; --up:#1F9D63; --dn:#E5484D; --new:#0E9F6E;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  --shadow:0 1px 2px rgba(27,35,51,.05),0 2px 8px rgba(27,35,51,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding-bottom:48px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
header.top{padding:22px 0 10px}
.kicker{font-size:12px;letter-spacing:.08em;color:var(--me);font-weight:700}
h1{font-size:26px;margin:4px 0 6px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:13px;line-height:1.5}
.krow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seasons{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seasons a{font-size:13px;font-weight:800;color:var(--mute);text-decoration:none;padding:5px 12px;border-radius:7px;line-height:1.2}
.seasons a.on{background:var(--me);color:#fff}
.seasons a .s{font-weight:500;font-size:11px;margin-left:3px;opacity:.85}
.krow.subrow{justify-content:flex-end;margin-top:6px}
.seasons.sub a{font-size:12px;padding:4px 10px}
.golink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:700;color:var(--me);text-decoration:none;background:#EEF3FF;border-radius:10px;padding:8px 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--mute)}
nav.chips{position:sticky;top:0;z-index:5;background:rgba(242,244,248,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin-top:14px}
nav.chips .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
nav.chips button{flex:0 0 auto;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.cg{display:flex;gap:6px;flex:0 0 auto}
.tnav{display:none}
nav.chips button.on{color:#fff;background:var(--me);border-color:var(--me);font-weight:700}
section{padding-top:24px}
h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.h2sub{color:var(--mute);font-size:12.5px;margin-bottom:10px;line-height:1.45}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;font-weight:700;white-space:nowrap;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
.d{color:var(--dim)} .m{color:var(--mute)}
.up{color:var(--up)} .dn{color:var(--dn)}
.ico{width:22px;height:22px;border-radius:5px;display:inline-block;vertical-align:middle;background:#E9EDF4;object-fit:cover;flex:0 0 auto}

.teams{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:900px){ .teams{grid-template-columns:1fr 1fr} }
@media (min-width:1200px){ body{padding:0 20px} .wrap{max-width:1440px} .teams{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}  }   /* 데스크탑: 네 팀 한 줄 (형 11-15) */
 /* 폰: 팀은 옆으로 넘기기, 거르기는 세 줄 (형 11-15) */
@media (max-width:899px){
  nav.chips{position:static;background:none;border-bottom:0;backdrop-filter:none}
  nav.chips .wrap{flex-direction:column;gap:6px;overflow:visible}
  nav.chips .csep{display:none}
  nav.chips .cg{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
  nav.chips .cg button{padding:8px 4px;text-align:center}
  .tnav{display:flex;gap:6px;position:sticky;top:0;z-index:6;background:rgba(242,244,248,.95);backdrop-filter:blur(6px);padding:8px 0;margin:0 0 8px}
  .tnav button{flex:1;font-size:13px;font-weight:800;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--mute)}
  .teams{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none;align-items:flex-start}
  .teams::-webkit-scrollbar{display:none}
  .tcard{flex:0 0 calc(100% - 16px);scroll-snap-align:center}
  .tnav button{text-align:center}
  .h2ctl{width:100%;justify-content:space-between}
  table.cmp{font-size:12px} .cmpw{overflow-x:auto}
}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.thead{padding:14px 14px 12px}
.thead .code{font-size:26px;font-weight:900;letter-spacing:.02em}
.thead .meta{font-size:12.5px;opacity:.85;margin-top:2px}
.tbody{padding:10px 12px 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.btag{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#EEF3FF;color:#2F5BCB;border:1px solid #D7E2FF}
.csep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px;flex:0 0 auto}
.btag.more{background:#fff;color:var(--mute);border-color:var(--line)}
.btag.on{background:#2F5BCB;color:#fff}
/* 팀 딱지 색 = 리포트 딱지 색 (형 11-15): 같은 이름은 리포트 팀 딱지 색, 나머지는 비슷한 선수 딱지 색 */
.btag.k-weight{background:#111;border-color:#AA8A3C;color:#D4AF5A;font-weight:800}
.btag.k-circus{background:#E2012D;border-color:#E2012D;color:#fff;font-weight:800}
.btag.k-tank{background:#F37321;border-color:#F37321;color:#fff;font-weight:800}
.btag.k-up{background:#FFEAD9;border-color:#F2B98C;color:#B4530B}
.btag.k-down{background:#DDF0FB;border-color:#92CBEB;color:#0F6A9C}
.btag.k-chall{background:linear-gradient(120deg,#E3F1FF 0%,#FFF4D9 100%);border-color:#D4AE4E;color:#1D5AA6;font-weight:800}
.btag.k-bronze{background:#F5E6DA;border-color:#C9936A;color:#7E4B26}
.btag.k-gold{border-color:#D98A1F;color:#D98A1F;background:rgba(217,138,31,.08)}
.btag.k-pos{background:#E8F6EF;border-color:#BFE6D1;color:#1B7A4D}
.btag.k-def{background:linear-gradient(120deg,#E3E8FF,#EEF1FF);border-color:#9DAAF0;color:#3341A8}
.btag.k-etc{background:#F1F4F9;border-color:#C9D1DE;color:#4A5468}
.btag[class*=" k-"].on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #1B2333}
.why{font-size:12.5px;color:#3A4458;background:#F4F6FA;border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.5}
.mix{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--mute);margin:10px 0 4px}
.mix b{color:var(--ink)}
.prow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;width:100%;padding:7px 2px;border-top:1px solid #EEF1F6}
.prow .sc{font-weight:800;font-size:14px;text-align:center}
.prow .nm{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.prow .nm .n{font-weight:700;font-size:14px}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.h2ctl{display:flex;align-items:center;gap:8px}
.plainbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--mute)}
.plainbtn .sw{width:28px;height:16px;border-radius:999px;background:#D5DBE5;position:relative;transition:background .15s}
.plainbtn .sw i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.plainbtn[aria-pressed="true"]{color:var(--ink)} .plainbtn[aria-pressed="true"] .sw{background:var(--me)} .plainbtn[aria-pressed="true"] .sw i{left:14px}
/* 수상 표시 끄기 (형 11-15): 알체·올프로만 숨기고 잔류 표시는 다시 */
body.nohon .hon{display:none!important}
.sortseg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.sortseg button{border:0;background:none;font-size:12.5px;font-weight:700;color:var(--mute);padding:5px 11px;border-radius:7px}
.sortseg button.on{background:var(--me);color:#fff}
.pk.add{font-size:11px;font-weight:700;color:var(--muted,#687287)}
.prow.staff{border-radius:8px;border-top-color:transparent;margin-top:2px;padding-left:9px}
.prow .rl{font-size:11px;font-weight:800;letter-spacing:-.02em}
.prow .pk{font-size:12px;color:var(--dim);font-weight:700}
.prow .rs{display:flex;align-items:center;gap:6px} .prow .rs .sc2{font-weight:700;font-size:13px}
.hon{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:rgba(217,138,31,.08);color:#D98A1F;border:1px solid #D98A1F;white-space:nowrap;flex:0 0 auto}
.hon.h1{background:linear-gradient(120deg,#E3F1FF 0%,#FFF4D9 100%);border-color:#D4AE4E;color:#1D5AA6;font-weight:800}   /* 시즌 알체 = 리포트 '천상계 학살자'와 같은 챌린저색 (형 11-15) */
.hon.h3{background:#E8EEFF;border-color:#8FA9F2;color:#3550B8}   /* 올프로 = 리포트 '중간계 학살자'와 같은 다이아색 · 나머지 알체는 리포트 수상 금색 */
.prow .pos,.from .fr{display:none!important} body:not(.nohon) .prow .stayb{display:none}   /* 폰·데스크탑 같은 정보 (형 11-15) */
.prow .nm{flex-wrap:nowrap!important;overflow:hidden} .prow .nm .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.prow .pos{font-size:11px;color:var(--dim)} .from .fr{font-size:11px;color:var(--dim);margin-left:2px} .snote{color:var(--dim);font-size:10px;margin-left:1px}
.prow .dl{font-size:12px;font-weight:700;white-space:nowrap}
.from{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--mute)}
.newb{font-size:10.5px;font-weight:800;color:#fff;background:var(--new);border-radius:5px;padding:1px 5px;letter-spacing:.03em}
.stayb{font-size:11px;color:var(--dim)}
.pdet{grid-column:1 / -1;font-size:12px;color:var(--mute);background:#F7F8FB;border-radius:8px;padding:6px 8px;margin-top:2px;display:none}
.prow.open .pdet{display:none}
/* 선수 카드 (S11 기본, S10 눌러서) */
.pov{position:fixed;inset:0;background:rgba(15,22,41,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.pov[hidden]{display:none}
.pc-frame{display:block;width:100%;border:0;height:70vh;min-height:300px}
.psheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 22px}
@media (min-width:700px){ .pov{align-items:center} .psheet{border-radius:18px} }
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc-nm{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.pc-meta{font-size:12.5px;color:var(--mute);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pc-x{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;color:var(--mute)}
.pc-seg{display:inline-flex;background:#F1F4F9;border-radius:10px;padding:3px;gap:2px;margin:14px 0 10px}
.pc-seg button{border:0;background:none;font-size:13px;font-weight:800;color:var(--mute);padding:6px 16px;border-radius:7px}
.pc-seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(27,35,51,.12)}
.pc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pc-t{background:#F4F6FA;border-radius:10px;padding:9px 8px}
.pc-t b{display:block;font-size:17px;font-weight:800}
.pc-t span{font-size:11px;color:var(--mute)}
.pc-t.empty b{color:#C3CAD6}
.pc-h{font-size:12.5px;font-weight:800;margin:14px 0 6px;color:var(--ink)}
.pc-lane{display:grid;grid-template-columns:34px 1fr 26px;gap:8px;align-items:center;font-size:12px;margin:4px 0}
.pc-lane i{display:block;height:8px;border-radius:4px;background:var(--me)} .pc-lane .bg{background:#EEF1F6;border-radius:4px}
.pc-ch{display:flex;gap:8px}
.pc-ch>div{flex:1;background:#F4F6FA;border-radius:10px;padding:8px;display:flex;align-items:center;gap:8px;font-size:12px}
.pc-ch .ico{width:30px;height:30px}
.pc-none{font-size:13px;color:var(--mute);background:#F4F6FA;border-radius:10px;padding:14px;text-align:center}
.prow.hide{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.dest{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:700px){ .dest{grid-template-columns:repeat(4,1fr)} }
.dest .dh{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:6px}
.chiplist{display:flex;flex-wrap:wrap;gap:5px}
.pc{font-size:12.5px;padding:3px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){ .two{grid-template-columns:1fr 1fr} }
.lrow{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #EEF1F6;font-size:13.5px}
.lrow:first-of-type{border-top:0}
.lrow .rk{color:var(--dim);font-weight:700}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th,table.cmp td{padding:8px 6px;border-top:1px solid #EEF1F6;text-align:center}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--mute);font-weight:400}
table.cmp thead th{border-top:0}
table.cmp td.best{font-weight:800}
.gone{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:700px){ .gone{grid-template-columns:repeat(4,1fr)} }
.note{font-size:12px;color:var(--mute);line-height:1.55}
footer{margin-top:28px;font-size:12px;color:var(--dim)}
@media (max-width:420px){ .stats{grid-template-columns:repeat(2,1fr)} h1{font-size:23px} }
</style>
</head>

const TKC = n => ({'체급':'k-weight','서커스':'k-circus','파괴전차':'k-tank','상체캐리':'k-up','하체캐리':'k-down','천상계 부자':'k-chall','지하계 부자':'k-bronze','우승 DNA':'k-gold','베테랑':'k-pos','밸런스':'k-def','새 판':'k-etc','신생 팀':'k-etc'})[n] || 'k-etc';
const FOLD = tags => tags.length > 4 || (tags.length === 4 && tags.reduce((a,x)=>a+x[0].replace(/\s/g,'').length,0) > 16);
const hexA = (h,a) => { const n = parseInt(h.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };

const ns = P.filter(p=>kind(p)==='new').length, mv = P.filter(p=>kind(p)==='moved').length, upn = P.filter(p=>delta(p)>0).length, dnn = P.filter(p=>delta(p)<0).length;
$('#hsub').innerHTML = `드래프트 결과 · ${ORDER.length}팀 ${P.length}명${(D.passed||[]).length?` · 유찰 ${D.passed.length}명`:''}${D.unassigned.length?` · 팀 미정 ${D.unassigned.length}명`:''}`;
$('#stats').innerHTML = [[mv,'이적'],[ns,'신규'],[D.gone.length,'S11 미참가'],[`<span class="up">▲${upn}</span> <span class="dn">▼${dnn}</span>`,'점수 변동']].map(([v,l])=>`<div class="stat"><b class="num">${v}</b><span>${l}</span></div>`).join('');
const CH = [['all','전체'],['moved','이적'],['new','신규'],['delta','변동'],['|',''],['p:탑','탑'],['p:정글','정글'],['p:미드','미드'],['p:원딜','원딜'],['p:서폿','서폿'],['|',''],['multi','멀티포지션'],['allr','올라운더']];   // 팀 바로가기 대신 라인(S10 주 라인) 거르기 (형 11-15)
function drawChips(){ // 묶음(구분선 기준)별로: 데스크탑은 한 줄, 폰은 묶음마다 한 줄 (형 11-15)
  const g = [[]]; CH.forEach(x=>{ if(x[0]==='|') g.push([]); else g[g.length-1].push(x); });
  $('#chips').innerHTML = g.map((arr,i)=>`${i?'<span class="csep"></span>':''}<div class="cg" style="--n:${arr.length}">${arr.map(([k,l])=>`<button class="${FIL===k?'on':''}" data-f="${k}" style="${chipSty(k, FIL===k)}">${l}</button>`).join('')}</div>`).join(''); }
// 탭 색 묶음별로 (형 11-15): 상태 = 남색, 라인 = 리포트 라인 색, 멀티/올라운더 = 라인 그라데이션
const POSC = {탑:['#FFEAD9','#B4530B'], 정글:['#DFF5E3','#1E7A3C'], 미드:['#ECE6FD','#6A3FC9'], 원딜:['#DDF0FB','#0F6A9C'], 서폿:['#FCE4EF','#B42367']};
const RAIN = `linear-gradient(90deg,${Object.values(POSC).map((c,i)=>`${c[0]} ${i*25}%`).join(',')})`;
function chipSty(k, on){
  if(k.startsWith('p:')){ const c = POSC[k.slice(2)]; return on ? `background:${c[0]};color:${c[1]};border-color:${c[1]};font-weight:800` : `color:${c[1]}`; }
  if(k==='multi'||k==='allr') return on ? `background:${RAIN};color:#1B2333;border-color:#9AA6BC;font-weight:800` : '';
  return '';
}
function prow(p){
  const k = kind(p), s = p.s10;
  const orig = k==='new' ? '<span class="newb">NEW</span>' : k==='moved' ? `<span class="from">${tg(p.from_)}<span class="fr">에서</span></span>` : '<span class="stayb">잔류</span>';
  const det = s ? `S10 ${p.from_||''} · ${laneTxt(p)||s.pos} · ${s.g}판 ${s.w}승 ${s.g-s.w}패${s.rating!=null&&s.nsc>=3?` · 평점 ${s.rating.toFixed(1)}`:''} · KDA ${s.kda}${s.pog?` · POG ${s.pog}`:''}${s.champ?` · 최다 ${s.champ}`:''}`
    : k==='new' ? '리그 기록 없음' : `S10 ${p.from_} 명단 · 출전 기록 없음`;
  const sc10 = p.score10!=null ? ` · 점수 ${p.score10} → ${p.score}` : '';
  const show = FIL==='all' || (FIL==='moved' && k==='moved') || (FIL==='new' && k==='new') || (FIL==='delta' && delta(p)) || (FIL.startsWith('p:') && s && s.pos===FIL.slice(2)) || (FIL==='multi' && isMulti(p)) || (FIL==='allr' && isAllr(p));
  const st = isStaff(p), c = TC[p.team] || ['#334155','#fff'];
  const left = st ? `<span class="rl" style="color:${c[0]==='#000000'?'#B5651D':c[0]}">${p.role}</span>` : SORT==='draft' ? (typeof p.role==='number' ? `<span class="pk num">${p.role}</span>` : `<span class="pk add">${p.role}</span>`) : `<span class="sc num">${p.score}</span>`;
  const right = (SORT==='draft' || st) ? `<span class="rs"><span class="sc2 num">${p.score}</span>${dl(p)}</span>` : dl(p);
  return `<button class="prow${show?'':' hide'}${st?' staff':''}" data-pr="1" data-pn="${esc(p.name)}"${st?` style="background:${hexA(c[0], c[0]==='#000000'?.07:.13)};"`:''}>${left}<span class="nm">${s&&s.champ?ic(s.champ):''}<span class="n">${esc(p.name)}</span>${p.hon?`<span class="hon h${p.hon[1]}">${esc(p.hon[0])}</span>`:''}${orig}${s?`<span class="pos">· ${isAllr(p)?'올라운더':isMulti(p)?Object.entries(s.posc).filter(([,v])=>v>=3).sort((a,b)=>b[1]-a[1]).map(([q])=>q).join('/'):s.pos}</span>`:''}</span>${right}<span class="pdet">${det}${sc10}${p.n10?` · S10 이름 ${esc(p.n10)}`:''}</span></button>`;
}
function drawTeams(){ const sl = $('#teams').scrollLeft;
  $('#teams').innerHTML = ORDER.map(t=>{ const m = D.tm[t], c = TC[t] || ['#334155','#fff'];
    const ps = P.filter(p=>p.team===t).sort((a,b)=>{ const sa=isStaff(a), sb=isStaff(b); if(sa||sb) return sa&&sb ? STAFF[a.role]-STAFF[b.role] : sa?-1:1;
      return SORT==='draft' ? pkN(a)-pkN(b) : (b.score-a.score || a.name.localeCompare(b.name)); });
    const tags = (m.tags||[]);
    const openT = OPEN_TAG[t];
    const posn = Object.entries(m.posn).filter(([,v])=>v).map(([q,v])=>`${q} ${v}`).join(' · ');
    return `<div class="tcard" id="t-${t}"><div class="thead" style="background:${c[0]};color:${c[1]}"><div class="code">${t}</div><div class="meta num">합 ${m.sum} · 평균 ${m.avg} · ${m.n}명</div></div>
      <div class="tbody">${tags.length?`<div class="tags">${tags.map((x,i)=>(FOLD(tags) && !MORE_TAG[t] && i>=3) ? '' : `<button class="btag ${TKC(x[0])}${openT===i?' on':''}" data-tag="${t}|${i}">${x[0]}</button>`).join('')}${FOLD(tags) && !MORE_TAG[t] ? `<button class="btag more" data-moretag="${t}">+${tags.length-3}</button>` : ''}</div>${openT!=null&&tags[openT]?`<div class="why">${esc(tags[openT][1])}</div>`:''}`:''}
      <div class="mix">${m.newteam?'<span><b>신생 팀</b></span>':`<span>잔류 <b>${m.stay}</b></span>`}<span>이적 <b>${m.moved}</b></span><span>신규 <b>${m.new}</b></span>${m.champs?`<span>S10 우승 멤버 <b>${m.champs}</b></span>`:''}</div>
      <div class="mix" style="margin-top:0"><span>S10 주 라인: ${posn||'–'}</span></div>
      ${ps.map(prow).join('')}</div></div>`; }).join('');
  $('#teams').scrollLeft = sl; drawTnav();
}
function drawZRN(){
  const z = P.filter(p=>p.from_==='ZRN');
  $('#zrn').innerHTML = ORDER.map(t=>{ const ps = z.filter(p=>p.team===t).sort((a,b)=>b.score-a.score); return `<div class="card"><div class="dh">${tg(t)}<span class="m" style="font-weight:400;font-size:13px">${ps.length}명</span></div><div class="chiplist">${ps.map(p=>`<span class="pc">${esc(p.name)} <span class="d num">${p.score}</span></span>`).join('')||'<span class="d" style="font-size:12.5px">없음</span>'}</div></div>`; }).join('');
}
function drawDelta(){
  const ch = P.filter(p=>delta(p));
  const lst = (arr, h) => `<div class="card"><div style="font-weight:800;margin-bottom:4px">${h}</div>${arr.map((p,i)=>`<div class="lrow"><span class="rk">${i+1}</span><span>${tg(p.team)} <b>${esc(p.name)}</b></span><span class="num">${p.score10} → ${p.score} ${dl(p)}</span></div>`).join('')||'<div class="d" style="font-size:12.5px">없음</div>'}</div>`;
  const up = ch.filter(p=>delta(p)>0).sort((a,b)=>delta(b)-delta(a)||b.score-a.score), dn = ch.filter(p=>delta(p)<0).sort((a,b)=>delta(a)-delta(b)||b.score-a.score);
  const cut = (arr) => { if(arr.length<=5) return arr; const v = delta(arr[4]); return arr.filter((p,i)=>i<5 || delta(p)===v).slice(0,8); };
  $('#delta').innerHTML = lst(cut(up), `오른 사람 <span class="m" style="font-weight:400;font-size:12.5px">${up.length}명</span>`) + lst(cut(dn), `내린 사람 <span class="m" style="font-weight:400;font-size:12.5px">${dn.length}명</span>`);
}
function drawCmp(){
  const R = [['평균 점수','avg'],['S10 평균 평점','rt'],['40점 이상','top40'],['25점 이상 (천상 가능)','hi25'],['20점 이하 (지하 가능)','low20'],['잔류','stay'],['이적','moved'],['신규','new'],['S10 우승 멤버','champs'],['S10 리그 판수 합','games'],['S10 상체 평점','up'],['S10 하체 평점','lo'],['S10 경기당 킬 (선수 평균)','kpg'],['S10 경기 합산 킬','tkpg']];
  $('#cmp').innerHTML = `<thead><tr><th></th>${ORDER.map(t=>`<th>${tg(t)}</th>`).join('')}</tr></thead><tbody>${R.map(([l,k])=>{ const vs = ORDER.map(t=>D.tm[t][k]); const mx = Math.max(...vs.filter(v=>v!=null));
    return `<tr><td>${l}</td>${vs.map(v=>`<td class="num${v===mx&&vs.filter(x=>x===mx).length<ORDER.length?' best':''}">${v==null?'–':Number.isInteger(v)?v:v.toFixed(k==='avg'||k==='tkpg'?1:2)}</td>`).join('')}</tr>`; }).join('')}</tbody>`;
}
function drawGone(){
  const by = {}; D.gone.forEach(g=>{ (by[g.team]||(by[g.team]=[])).push(g); });
  $('#gone').innerHTML = Object.keys(by).sort().map(t=>`<div class="card"><div class="dh" style="display:flex;gap:8px;align-items:center;font-weight:800;margin-bottom:6px">${tg(t)}<span class="m" style="font-weight:400;font-size:13px">S10 · ${by[t].length}명</span></div><div class="chiplist">${by[t].sort((a,b)=>(b.score||0)-(a.score||0)).map(g=>`<span class="pc">${esc(g.name)}${g.score!=null?` <span class="d num">${g.score}</span>`:''}</span>`).join('')}</div></div>`).join('')
    + (D.unassigned.length ? `<div class="card"><div style="font-weight:800;margin-bottom:6px">팀 미정 <span class="m" style="font-weight:400;font-size:13px">배정 확인 전</span></div><div class="chiplist">${D.unassigned.map(([n,s])=>`<span class="pc">${esc(n)} <span class="d num">${s}</span></span>`).join('')}</div></div>` : '');
}
$('#foot').textContent = `ALT 리그 S11 · 드래프트 결과 기준 · ${D.built} 업데이트`;
function drawTnav(){ const box = $('#teams');
  const cur = Math.round(box.scrollLeft / Math.max(1, (box.firstElementChild||{}).offsetWidth + 10));
  $('#tnav').innerHTML = ORDER.map((t,i)=>{ const c = TC[t]||['#334155','#fff']; return `<button data-tn="${i}" style="${i===cur?`background:${c[0]};color:${c[1]};border-color:${c[0]}`:`background:${hexA(c[0], c[0]==='#000000'?.06:.12)};color:${({'#B89EC6':'#7A5A8E'})[c[0]]||c[0]};border-color:${hexA(c[0],.35)}`}">${t}</button>`; }).join(''); }   // 팀 탭도 팀 색 (형 11-15)
document.addEventListener('click', e=>{ const b = e.target.closest('[data-tn]'); if(!b) return; const box = $('#teams'), card = box.children[+b.dataset.tn]; if(card) box.scrollTo({left: card.offsetLeft - 14, behavior:'smooth'}); });
let tnT = null; document.addEventListener('scroll', e=>{ if(e.target && e.target.id==='teams'){ clearTimeout(tnT); tnT = setTimeout(drawTnav, 60); } }, true);
function drawSort(){ $('#sortseg').innerHTML = [['draft','드래프트 순'],['score','점수 순']].map(([k,l])=>`<button class="${SORT===k?'on':''}" data-sort="${k}">${l}</button>`).join(''); }
document.addEventListener('click', e=>{ const pb = e.target.closest('#plainbtn'); if(pb){ const off = !document.body.classList.contains('nohon'); document.body.classList.toggle('nohon', off); pb.setAttribute('aria-pressed', String(!off)); } });
document.addEventListener('click', e=>{ const m = e.target.closest('[data-moretag]'); if(m){ MORE_TAG[m.dataset.moretag] = 1; drawTeams(); } });
document.addEventListener('click', e=>{ const b = e.target.closest('[data-sort]'); if(!b) return; SORT = b.dataset.sort; drawSort(); drawTeams(); });
function drawPass(){ const ps = D.passed||[]; $('#s-pass').hidden = !ps.length;
  $('#pass').innerHTML = ps.length ? `<div class="card"><div class="chiplist">${ps.slice().sort((a,b)=>b.score-a.score).map(p=>`<span class="pc">${p.from_?tg(p.from_)+' ':''}${esc(p.name)} <span class="d num">${p.score}${p.score10!=null&&p.score10!==p.score?` (S10 ${p.score10})`:''}</span></span>`).join('')}</div></div>` : ''; }
let CARD = {n:null, s:'S10'}   // 프리뷰에선 S10 카드가 기본 (형 11-15);
function openCard(n){ CARD = {n, s:'S10'}; drawCard(); $('#pov').hidden = false; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('#pov').hidden = true; });
function drawCard(){
  // 선수 카드 = S10 리포트의 카드 그대로 (iframe). S11은 같은 틀을 비워서 (형 11-15)
  const p = P.find(x=>x.name===CARD.n); if(!p) return; const k = kind(p);
  const role = typeof p.role==='string' ? p.role : `${p.role}픽`;
  const orig = k==='new' ? '<span class="newb">NEW</span>' : k==='moved' ? `${tg(p.from_)}<span class="d">에서 이적</span>` : '<span class="d">잔류</span>';
  const n10 = p.n10 || p.name;
  const src = CARD.s==='S11' ? `https://altreport.github.io/s10/#card=${encodeURIComponent(n10)}&blank=1&as=${encodeURIComponent(p.name)}` : `https://altreport.github.io/s10/#card=${encodeURIComponent(n10)}`;
  $('#psheet').innerHTML = `<div class="pc-top"><div class="pc-seg" style="margin:0"><button class="${CARD.s==='S10'?'on':''}" data-cs="S10">S10</button><button class="${CARD.s==='S11'?'on':''}" data-cs="S11">S11</button></div><button class="pc-x" data-cx="1">닫기</button></div>
    <div class="pc-meta" style="margin:10px 2px 6px">${CARD.s==='S11' ? `${tg(p.team)}<span>${role}</span>${orig}<span class="num">${p.score}점${p.score10!=null?' '+dl(p):''}</span>` : `${p.from_?tg(p.from_):''}<span>S10</span>${p.score10!=null?`<span class="num">${p.score10}점</span>`:''}`}</div>
    <iframe class="pc-frame" src="${src}" title="선수 카드" loading="eager"></iframe>`;
  const fr = $('#psheet .pc-frame'); const fit = () => { try{ const h = fr.contentDocument.documentElement.scrollHeight; if(h) fr.style.height = h + 'px'; }catch(e){} };
  fr.addEventListener('load', ()=>{ fit(); setTimeout(fit, 400); setTimeout(fit, 1500);
    try{ new ResizeObserver(()=>{ fr.style.height = '0px'; fit(); }).observe(fr.contentDocument.body); }catch(e){} });   // 카드 안에서 맞라인 등으로 바뀌면 높이 다시 (형 11-15)
}
function drawAll(){ drawSort(); setTimeout(drawTnav); drawPass(); drawChips(); drawTeams(); drawZRN(); drawDelta(); drawCmp(); drawGone(); }
document.addEventListener('click', e=>{
  const f = e.target.closest('[data-f]'); if(f){ FIL = f.dataset.f; drawChips(); drawTeams(); return; }
  const t = e.target.closest('[data-tag]'); if(t){ const [tm,i] = t.dataset.tag.split('|'); OPEN_TAG[tm] = OPEN_TAG[tm]===+i ? null : +i; drawTeams(); return; }
  const r = e.target.closest('[data-pr]'); if(r){ openCard(r.dataset.pn); return; }
  const sg = e.target.closest('[data-cs]'); if(sg){ CARD.s = sg.dataset.cs; drawCard(); return; }
  if(e.target.closest('[data-cx]') || e.target.id==='pov'){ $('#pov').hidden = true; return; }
});
drawAll();
</script>
</body>
</html>
